schema_version = "1alpha1"
subject_id = "signal-android-default"
subject_version = "1.0.0"
notes = "Unprovisioned lane declaration. \"default\" means the vendor-shipped settings profile asserted below, not an observed state. The installed app version, build, APK hash, device model, and OS build are intentionally unset: device-preflight captures them at measurement time. This subject cannot produce a canonical result until the synthetic number, the dedicated physical Android device, and the Signal provider-terms review are complete."

[client]
name = "Signal Android"
package_identifier = "org.thoughtcrime.securesms"
distribution_channel = "play-store"

[service]
name = "Signal Service"

[platform]
os = "Android"
architecture = "arm64-v8a"
is_emulator = false

[account]
account_type = "synthetic-mobile-number"
slot_id = "slot-signal-0001"
synthetic = true
authentication_method = "phone_number_sms"

[configuration]
profile = "default"

[[configuration.settings]]
name = "link_previews"
value = "enabled"

[[configuration.settings]]
name = "read_receipts"
value = "enabled"

[[configuration.settings]]
name = "contact_sync"
value = "enabled"

[network_vantage]
vantage_id = "chat-lane-unselected"
country_code = "DE"
network_type = "residential-unselected"
notes = "Measurement provider and city are not selected yet, but the country code mirrors the reference vantage in operations/1.0.0/operations.toml rather than the 'ZZ' unassigned placeholder, which spec/operations.py rejects for a reference vantage. Signal assigns relays by region and client build, so the vantage is part of what is under test. Keeping the same country as the email lane is what makes a chat row and an email row comparable at all; the provider, ASN, and city must be pinned before a canonical run."
