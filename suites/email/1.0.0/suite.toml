description = "The first canonical wedge: two native mail clients reading the same synthetic Gmail account from the same vantage, so a difference between rows is attributable to the client. The checks are separate rather than one aggregate because each has a different adversary and a different control, and a client that blocks body images while rendering a calendar invite is not caught by a body test. Draft because the EPT gateway is not pinned or deployed, no synthetic mailbox is provisioned, the physical Mac lane does not exist, the Google provider-terms review is pending, and the three checks that now have an adapter still need their gateway-side capability before they can report a product result."
