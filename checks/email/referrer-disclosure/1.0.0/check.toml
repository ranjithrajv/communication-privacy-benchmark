schema_version = "1alpha1"
check_id = "email.referrer-disclosure"
version = "1.0.0"
status = "draft"
title = "Referrer and identifier disclosure on a followed link"
description = "Determines what the client sends to a third-party host when the reader follows a link in a synthetic message, specifically whether a Referer header or a canary-carried identifier reaches a host the reader chose to visit. This is measured separately because a client can block all passive remote content and still leak the mailbox or message identifier on an active navigation the reader initiated deliberately, which is a consent question rather than a passive-tracking one. The EPT adapter answers this check against gateway observations that now carry the Referer header, and it refuses to report a clean client unless the gateway declares that it captured the header, because a gateway that never looked produces exactly the same observations as a client that leaked nothing. The definition remains draft: upstream cannot capture the header, so the private gateway must be changed to send it and must declare referer_captured, and until it does every run reports inconclusive rather than a clean result. A clean result is additionally reported as partial unless the test also ran a third-party canary host, because leakage to a host the reader did not choose to visit is the threat this check exists for and watching only the tracking host never exercises it."
channel = "email"
evidence_class = "measured"
adapter_id = "ept"
canonical = true
timeout_seconds = 1800
runner_classes = ["self_hosted_macos", "self_hosted_android"]

[[threat_models]]
id = "mailbox.identity-disclosure"
title = "Mailbox identity disclosure"
description = "A third-party host the reader visited learns the reader's mailbox or account identifier from a Referer header or a link identifier, and can correlate the visit with a specific account."

[[threat_models]]
id = "conversation.confidentiality"
title = "Conversation confidentiality"
description = "A third-party host learns that the reader is engaged in a specific conversation, and which parties it involves, from identifiers carried on a link."
