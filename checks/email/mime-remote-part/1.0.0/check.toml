schema_version = "1alpha1"
check_id = "email.mime-remote-part"
version = "1.0.0"
status = "draft"
title = "Remote content in calendar, vCard, SVG, and nested message parts"
description = "Determines whether the client fetches remote references outside the top-level HTML body: a calendar IMAGE or ATTACH URI, an X-ALT-DESC or STYLED-DESCRIPTION description, a vCard PHOTO, an inline SVG image or external entity, or the HTML of an attached or forwarded message. This is measured separately because a client may block remote content in the body and still render it from a calendar invite, a contact card, or a nested message, and the disclosure is the same while the control is not where a reader would look. The EPT adapter answers this check against the upstream calendar, vCard, SVG, and nested-message vectors, but the check remains draft: the MIME corpus is GPL-3.0 covered and needs licence and attribution review before those vectors can be reproduced, and the gateway is neither pinned nor deployed."
channel = "email"
evidence_class = "measured"
adapter_id = "ept"
canonical = true
timeout_seconds = 1800
runner_classes = ["self_hosted_macos", "self_hosted_android"]

[[threat_models]]
id = "message.read-disclosure"
title = "Message read disclosure"
description = "A party operating the canary learns that the message was opened, because the client rendered a remote reference from a calendar invitation, contact card, or nested message that the reader may not perceive as remote content."

[[threat_models]]
id = "attachment.preview-disclosure"
title = "Attachment preview disclosure"
description = "A party operating the canary learns that an attached or forwarded message was previewed, even when remote content is blocked in the top-level body."
