schema_version = "1alpha1"
check_id = "email.list-unsubscribe-fetch"
version = "1.0.0"
status = "draft"
title = "List-Unsubscribe header fetch"
description = "Determines whether the client fetches a URL supplied in a List-Unsubscribe header, which some clients do automatically and without any reader interaction. This is measured separately from body content because a reader who blocks remote images has usually taken no action against a header fetch at all, and a header is not content a reader can recognise as remote. Unimplemented because the vector requires a header the upstream corpus would have to supply, and because a header fetch happens before delivery is confirmed to the reader, so the probe window must span the whole client poll interval rather than a single open."
channel = "email"
evidence_class = "measured"
adapter_id = "unimplemented"
canonical = true
timeout_seconds = 3600
runner_classes = ["self_hosted_macos", "self_hosted_android"]

[[threat_models]]
id = "mailbox.content-disclosure"
title = "Mailbox content disclosure"
description = "A party operating the canary learns that a specific synthetic message reached a mailbox and was processed by the client, together with the reader's address, before the reader opened anything."
