schema_version = "1alpha1"
check_id = "email.dns-prefetch"
version = "1.0.0"
status = "draft"
title = "DNS and SNI resolution of canary URLs"
description = "Determines whether the client resolves a canary hostname without completing a request, through an anchor href, a dns-prefetch link, an image source, or a link preconnect. This is the vector that discloses the reader's DNS resolver rather than the reader, which is a different leak with a different adversary and must not be folded into the remote-content result. The adapter answers this check but the gateway must supply an authoritative DNS server with query logging, the SNI watcher must observe port 443, and the gateway must report the exercised vectors: the upstream DNS watcher only recognises the anchor-test and link-test labels, so the img-test label used by the image vector cannot be observed until upstream widens the pattern. Until the gateway reports dnsAnchor as exercised the adapter returns inconclusive rather than reporting a client that resolved nothing."
channel = "email"
evidence_class = "measured"
adapter_id = "ept"
canonical = true
timeout_seconds = 1800
runner_classes = ["self_hosted_macos"]

[[threat_models]]
id = "resolver.disclosure"
title = "Resolver disclosure"
description = "A party operating the canary's authoritative DNS server learns the address of the reader's DNS resolver, which identifies the internet provider and roughly the reader's location, and learns that a specific synthetic message was opened."

[[threat_models]]
id = "sni.disclosure"
title = "TLS SNI disclosure"
description = "A party observing TLS negotiation learns the canary hostname a client connected to, disclosing that the message was opened even when no request is ever completed."
