schema_version = "1alpha1"
check_id = "email.reader-identification"
version = "1.0.0"
status = "draft"
title = "Reader identification disclosed to the canary"
description = "Determines what the canary can learn about the reader from a single canary contact: source address, user agent, and any forwarded address chain. A client may block every remote fetch and still disclose the reader through a proxy or prefetch service that fetches on the user's behalf, so this is measured separately from whether a fetch happened at all. The adapter answers this check but the gateway must report the source address and user agent on each observation, because attributating a contact to the reader rather than to provider or vendor infrastructure requires a vantage observation and an address-attribution source. Only client-attributed contacts are scored, so a proxied fetch is never reported as a direct client disclosure, and a contact with no reported identifying field is partial rather than a pass."
channel = "email"
evidence_class = "measured"
adapter_id = "ept"
canonical = true
timeout_seconds = 1800
runner_classes = ["self_hosted_macos", "self_hosted_android"]

[[threat_models]]
id = "reader.location-disclosure"
title = "Reader location disclosure"
description = "A party operating the canary learns the reader's IP address and approximate location, and can correlate the synthetic message with a person or household."

[[threat_models]]
id = "reader.device-fingerprint"
title = "Reader device fingerprint"
description = "A party operating the canary learns the mail client build and operating system from the user agent, and can single out a reader among a shared address."
