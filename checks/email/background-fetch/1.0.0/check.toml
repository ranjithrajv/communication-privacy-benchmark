schema_version = "1alpha1"
check_id = "email.background-fetch"
version = "1.0.0"
status = "draft"
title = "Canary contact without the message being opened"
description = "Determines whether the client contacts the canary for a message the reader has not opened, for example through a background refresh, a server-side proxy that renders the body, or a pre-emptive remote-content scan. This is measured separately and is the only check that can legitimately report a contact with no reader interaction, so an unattributed contact here is evidence about the provider's mail path rather than about the client. The EPT adapter answers this check against the upstream background-fetch vectors, but the check remains draft: separating a provider-side scan from a client-side prefetch needs the reference vantage and an attribution source that do not exist yet, and the gateway is neither pinned nor deployed."
channel = "email"
evidence_class = "measured"
adapter_id = "ept"
canonical = true
timeout_seconds = 3600
runner_classes = ["self_hosted_macos", "self_hosted_android"]

[[threat_models]]
id = "provider.content-scanning"
title = "Provider content scanning"
description = "A party operating the canary learns that a message reached a provider server and was scanned there, which discloses that the message exists on the provider's infrastructure and roughly when it arrived, without the reader acting."

[[threat_models]]
id = "unattributed.prefetch"
title = "Unattributed prefetch"
description = "A canary contact occurs that cannot be attributed to the reader or to provider infrastructure, and reporting it as a client behaviour would be unsound."
