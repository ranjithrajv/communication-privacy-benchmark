schema_version = "1alpha1"
check_id = "email.remote-content"
version = "1.0.0"
status = "draft"
title = "Remote content loading on message open"
description = "Determines whether opening a synthetic test message causes the client to fetch remote resources without an explicit user action. The adapter and probe-window contract are defined, and the result is only reported once the gateway has confirmed delivery, an open, and watcher health, so an unexercised or broken probe yields inconclusive rather than a false pass. The definition remains draft until the gateway is pinned and deployed, a synthetic mailbox is provisioned, and the Google provider-terms review is approved."
channel = "email"
evidence_class = "measured"
adapter_id = "ept"
canonical = true
timeout_seconds = 1800
runner_classes = ["self_hosted_macos", "self_hosted_android"]

[[threat_models]]
id = "mailbox.content-disclosure"
title = "Mailbox content disclosure"
description = "A mailbox operator or other party learns that a specific synthetic message was opened, potentially together with the reader's IP address, user agent, or request timing."
