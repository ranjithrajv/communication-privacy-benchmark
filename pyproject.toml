[project]
name = "communication-privacy-benchmark"
version = "0.1.0"
description = "An open, GitHub Actions-based behavioral benchmark for communication privacy"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [
  { name = "Communication Privacy Benchmark contributors" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: GNU Affero General Public License v3",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
  "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
  "click>=8.5,<9",
  "httpx>=0.28,<0.29",
  "jsonschema>=4.26,<5",
  "pydantic>=2.13,<3",
]

[project.optional-dependencies]
automation = [
  "Appium-Python-Client>=6.0.7,<6.1",
  "playwright>=1.63,<1.64",
]

[project.scripts]
pt-bench = "privacy_benchmark.cli.main:main"

[project.urls]
Homepage = "https://github.com/ranjithrajv/communication-privacy-benchmark"
Issues = "https://github.com/ranjithrajv/communication-privacy-benchmark/issues"

[dependency-groups]
dev = [
  "hypothesis>=6.135,<7",
  "pip-licenses>=5,<6",
  "pytest>=9.1,<10",
  "pytest-cov>=7.1,<8",
  "ruff>=0.16,<0.17",
  "ty>=0.0.84,<0.1",
  "types-jsonschema>=4.26,<5",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/privacy_benchmark"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/checks",
  "/subjects",
  "/suites",
  "/operations",
  "/schemas",
  "/tests",
  "/tools",
  "/README.md",
  "/CHANGELOG.md",
  "/LICENSE",
  "/NOTICE",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
addopts = [
  "-ra",
  "--strict-config",
  "--strict-markers",
]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["privacy_benchmark"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.rules]
# ty has no `strict` switch: it checks unannotated function bodies and uses non-gradual
# list inference unconditionally. These are the disabled-by-default rules that approximate
# mypy's `--strict`; the rest of strict is covered by the defaults.
dynamic-function-decorator-return = "error"
missing-type-argument = "error"
possibly-unresolved-reference = "warn"
unsound-return-statement = "error"

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "B",
  "E",
  "F",
  "I",
  "PERF",
  "PIE",
  "PT",
  "PTH",
  "RET",
  "RUF",
  "SIM",
  "UP",
  "W",
]
ignore = [
  "PT011",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
