name: Email benchmark

# Protected canonical measurement lane. This workflow drives real synthetic mail
# accounts on physical Macs, so it is deliberately NOT triggered by pull requests:
# fork code must never reach a device or account lane. It runs only when a maintainer
# dispatches it, on its weekly schedule, or when the full-benchmark orchestrator calls
# it.
#
# Until the operational policy is active this workflow is expected to fail at the
# `plan` job, which is the gate. `pt-bench plan` refuses a canonical run for any
# subject without an approved provider-terms review, and it reports every outstanding
# subject at once. That refusal is the correct and intended state while the Google
# review is pending, the reference vantage is unselected, and no runner lane exists.
# A red run here means "the lane is not ready", not "the benchmark broke".

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Checked-in suite path to measure
        required: false
        default: suites/email/1.0.0/suite.toml
        type: string
  schedule:
    # Weekly, off-hour UTC minute. Deliberately not daily: account lock rates,
    # provider throttling, and meaningful temporal variance are not yet understood.
    - cron: "23 4 * * 2"
  workflow_call:
    inputs:
      suite:
        description: Checked-in suite path to measure
        required: false
        default: suites/email/1.0.0/suite.toml
        type: string

permissions:
  contents: read

# One canonical email run at a time. Never cancel: cancelling mid-measurement would
# abandon a synthetic account in an unknown state and could collide with the next run
# on the same device or mailbox slot.
concurrency:
  group: email-benchmark
  cancel-in-progress: false

env:
  UV_NO_PROGRESS: "1"
  UV_LINK_MODE: copy
  PT_BENCH_EPT_GATEWAY_URL: ${{ secrets.PT_BENCH_EPT_GATEWAY_URL }}
  PT_BENCH_EPT_GATEWAY_TOKEN: ${{ secrets.PT_BENCH_EPT_GATEWAY_TOKEN }}
  PT_BENCH_EPT_MAILBOXES: ${{ secrets.PT_BENCH_EPT_MAILBOXES }}

jobs:
  plan:
    name: Plan canonical run
    # Hosted runner: planning reads checked-in definitions and the operations policy.
    # It needs no device, so an unprovisioned lane fails here in seconds rather than
    # leaving a self-hosted job queued against a runner that does not exist.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      suite: ${{ steps.select.outputs.suite }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.18"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --locked --all-extras --all-groups

      - name: Select the suite
        # The dispatch input is untrusted text, so it is passed through the environment
        # and validated as a path inside the repository rather than interpolated into
        # the shell. It must name a suite that is actually checked in.
        id: select
        env:
          REQUESTED_SUITE: ${{ inputs.suite }}
        run: |
          suite="${REQUESTED_SUITE:-suites/email/1.0.0/suite.toml}"
          case "$suite" in
            /*|*..*)
              echo "suite must be a relative path inside the repository: $suite" >&2
              exit 1
              ;;
          esac
          if [ ! -f "$suite" ]; then
            echo "no such checked-in suite: $suite" >&2
            exit 1
          fi
          echo "suite=$suite" >> "$GITHUB_OUTPUT"

      - name: Validate the operational policy
        # Exit 2 means the policy is well-formed but canonical measurement is still
        # blocked, which the next step reports in detail. Only exit 1 is fatal here.
        run: |
          status=0
          uv run --locked pt-bench operations validate || status=$?
          if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then
            echo "operations policy is invalid" >&2
            exit "$status"
          fi

      - name: Build the run plan
        # This is the canonical gate. It refuses any subject without an approved
        # provider-terms review and names every outstanding subject in one failure.
        env:
          SUITE: ${{ steps.select.outputs.suite }}
        run: uv run --locked pt-bench plan --suite "$SUITE" --output build/plan.json

      - name: Summarise the gate
        if: always()
        env:
          SUITE: ${{ steps.select.outputs.suite }}
        run: |
          {
            echo "## Email benchmark plan"
            echo
            echo "- Suite: \`$SUITE\`"
            echo "- Run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f build/plan.json ]; then
            echo "- Plan: created" >> "$GITHUB_STEP_SUMMARY"
            uv run --locked pt-bench schemas validate --kind run-plan build/plan.json \
              >> "$GITHUB_STEP_SUMMARY" || true
          else
            echo "- Plan: **refused** (see the job log for the outstanding obligations)" \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the run plan
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: email-benchmark-plan
          path: build/plan.json
          if-no-files-found: warn
          retention-days: 90

  subject:
    name: Measure ${{ matrix.subject }} repetition ${{ matrix.repetition }}
    needs: plan
    # Physical Mac lane. Unreachable while the plan gate refuses, because `needs`
    # short-circuits; when the lane is provisioned this is the only job that touches a
    # real account or device.
    runs-on: [self-hosted, macOS, apple-mail-device-bank]
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        subject: [apple-mail-gmail-consumer, thunderbird-gmail-consumer]
        repetition: [1, 2, 3]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.18"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --locked --all-extras --all-groups

      - name: Download the run plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: email-benchmark-plan
          path: build

      - name: Observe the measurement device
        # Records the Mail/Thunderbird build, macOS build, and hardware model that the
        # subject intentionally left unset, so a published row states what was actually
        # measured rather than what was assumed at declaration time.
        run: |
          uv run --locked pt-bench preflight \
            --subject "${{ matrix.subject }}@1.0.0" \
            --output build/observation.json

      - name: Measure one repetition
        env:
          SUBJECT: ${{ matrix.subject }}
          REPETITION: ${{ matrix.repetition }}
        run: |
          uv run --locked pt-bench execute \
            --plan build/plan.json \
            --subject "$SUBJECT" \
            --adapter ept \
            --repetition "$REPETITION" \
            --output-dir build/executions

      - name: Finalize the execution
        env:
          SUBJECT: ${{ matrix.subject }}
          REPETITION: ${{ matrix.repetition }}
        run: |
          uv run --locked pt-bench finalize \
            --plan build/plan.json \
            --execution-dir "build/executions/$SUBJECT/$(printf '%04d' "$REPETITION")"

      - name: Upload the execution
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: email-execution-${{ matrix.subject }}-${{ matrix.repetition }}
          path: build/executions
          if-no-files-found: warn
          retention-days: 30

  aggregate:
    name: Aggregate the run
    needs: [plan, subject]
    # Runs even when a subject failed or was cancelled, so an incomplete run is
    # represented as an incomplete bundle rather than silently vanishing. Missing
    # subjects become `error`/`not_tested` in the bundle, never a product `fail`.
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.18"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --locked --all-extras --all-groups

      - name: Download the run plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: email-benchmark-plan
          path: build

      - name: Stop when the plan gate refused
        # When the plan gate refuses there is no plan and nothing to aggregate. This job
        # still runs, per the architecture, so an incomplete run is visible rather than
        # silently absent, but it must not report a misleading missing-artifact failure.
        # `final-health-check` is the single authoritative verdict.
        if: hashFiles('build/plan.json') == ''
        run: |
          echo "The plan gate refused this run, so there is nothing to aggregate." \
            >> "$GITHUB_STEP_SUMMARY"
          echo "skipped_aggregate=true" >> "$GITHUB_ENV"

      - name: Download every available execution
        if: hashFiles('build/plan.json') != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          pattern: email-execution-*
          path: build/executions
          merge-multiple: true

      - name: Aggregate
        # Exit 2 means the bundle is valid but incomplete, which is reported rather
        # than hidden. Only a genuine aggregation failure is fatal here.
        if: hashFiles('build/plan.json') != ''
        run: |
          status=0
          uv run --locked pt-bench aggregate \
            --plan build/plan.json \
            --executions build/executions \
            --output build/bundle || status=$?
          if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then
            echo "aggregation failed" >&2
            exit "$status"
          fi
          echo "aggregate_exit=$status" >> "$GITHUB_ENV"

      - name: Validate the bundle contract
        if: hashFiles('build/bundle/manifest.json') != ''
        run: uv run --locked pt-bench schemas validate --kind run-bundle build/bundle/manifest.json

      - name: Upload the run bundle
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: email-benchmark-bundle
          path: build/bundle
          if-no-files-found: warn
          retention-days: 90

  publish:
    name: Publish the run
    needs: [plan, aggregate]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.18"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --locked --all-extras --all-groups

      - name: Download the run bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: email-benchmark-bundle
          path: build
        continue-on-error: true

      - name: Offer the bundle for publication
        # Fail-closed. Every unmet requirement is reported at once. While the policy is
        # draft this exits 2 with the full list of outstanding obligations, which is the
        # intended state until the lane is provisioned.
        run: |
          if [ ! -f build/bundle/manifest.json ]; then
            echo '{"published": false, "reasons": ["no run bundle was produced"]}' \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 2
          fi
          uv run --locked pt-bench publish \
            --bundle build/bundle \
            --staging build/publication | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the publication receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: email-benchmark-receipt
          path: build/publication
          if-no-files-found: warn
          retention-days: 90

  transport:
    name: Publish the bundle
    needs: [plan, aggregate, publish]
    # Reached only when the harness actually produced a publication receipt, which it
    # does only for a bundle that cleared every operational requirement. The reusable
    # transport re-checks the receipt before moving any bytes, so a missing receipt is a
    # hard stop rather than an upload of unvetted data.
    if: needs.publish.result == 'success'
    uses: ./.github/workflows/_publish-benchmark.yml
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      lane: email
      bundle-artifact: email-benchmark-bundle
      receipt-artifact: email-benchmark-receipt
      release-tag: benchmark-data

  final-health-check:
    name: Final health check
    needs: [plan, subject, aggregate, publish, transport]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # The single authoritative verdict. A product `fail` is a successful measurement
      # and does not fail this job; an incomplete or unpublished run does.
      - name: Report the run outcome
        env:
          PLAN: ${{ needs.plan.result }}
          AGGREGATE: ${{ needs.aggregate.result }}
          PUBLISH: ${{ needs.publish.result }}
          TRANSPORT: ${{ needs.transport.result }}
        run: |
          {
            echo "## Final health check"
            echo
            echo "- plan: \`$PLAN\`"
            echo "- aggregate: \`$AGGREGATE\`"
            echo "- publish: \`$PUBLISH\`"
            echo "- transport: \`$TRANSPORT\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$PLAN" != "success" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The canonical lane was refused at the plan gate. See the plan job for" \
              "the outstanding provider-terms reviews, vantage, and runner lanes." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "$AGGREGATE" != "success" ] || [ "$PUBLISH" != "success" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The run did not aggregate and publish cleanly." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "$TRANSPORT" != "success" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The bundle cleared the gate but was not transported to the release." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
