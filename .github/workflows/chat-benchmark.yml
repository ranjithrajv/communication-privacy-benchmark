name: Chat benchmark

# Protected canonical measurement lane for the Android chat pilot. Like the email lane
# this is never triggered by pull requests: fork code must never reach a physical device
# or a messaging account.
#
# The email and chat lanes hold disjoint resources (Macs and mailboxes versus Android
# devices and phone numbers), so they run under separate concurrency groups and do not
# block one another.
#
# While the operational policy is draft this workflow is expected to fail at the `plan`
# gate, which names every outstanding provider-terms review. A red run here means "the
# lane is not ready", not "the benchmark broke".

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Checked-in suite path to measure
        required: false
        default: suites/chat/1.0.0/suite.toml
        type: string
  schedule:
    # Weekly, off-hour UTC minute, offset from the email lane.
    - cron: "41 4 * * 3"
  workflow_call:
    inputs:
      suite:
        description: Checked-in suite path to measure
        required: false
        default: suites/chat/1.0.0/suite.toml
        type: string

permissions:
  contents: read

# Never cancel: cancelling mid-measurement leaves a synthetic account in an unknown
# state and can collide with the next run on the same device or number.
concurrency:
  group: chat-benchmark
  cancel-in-progress: false

env:
  UV_NO_PROGRESS: "1"
  UV_LINK_MODE: copy
  PT_BENCH_CHAT_GATEWAY_URL: ${{ secrets.PT_BENCH_CHAT_GATEWAY_URL }}
  PT_BENCH_CHAT_GATEWAY_TOKEN: ${{ secrets.PT_BENCH_CHAT_GATEWAY_TOKEN }}
  PT_BENCH_CHAT_NUMBERS: ${{ secrets.PT_BENCH_CHAT_NUMBERS }}

jobs:
  plan:
    name: Plan canonical run
    # Hosted runner. Planning needs no device, so an unprovisioned device bank fails
    # here in seconds rather than leaving jobs queued against a runner that does not
    # exist. This job is the canonical gate.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.18"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --locked --all-extras --all-groups

      - name: Select the suite
        # The dispatch input is untrusted text: it is passed through the environment and
        # validated as a path inside the repository, never interpolated into the shell.
        id: select
        env:
          REQUESTED_SUITE: ${{ inputs.suite }}
        run: |
          suite="${REQUESTED_SUITE:-suites/chat/1.0.0/suite.toml}"
          case "$suite" in
            /*|*..*)
              echo "suite must be a relative path inside the repository: $suite" >&2
              exit 1
              ;;
          esac
          if [ ! -f "$suite" ]; then
            echo "no such checked-in suite: $suite" >&2
            exit 1
          fi
          echo "suite=$suite" >> "$GITHUB_OUTPUT"

      - name: Validate the operational policy
        # Exit 2 means the policy is well-formed but canonical measurement is still
        # blocked, which the plan step reports in detail. Only exit 1 is fatal.
        run: |
          status=0
          uv run --locked pt-bench operations validate || status=$?
          if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then
            echo "operations policy is invalid" >&2
            exit "$status"
          fi

      - name: Build the run plan
        # The canonical gate: refuses any subject without an approved provider-terms
        # review and names every outstanding subject in one failure.
        env:
          SUITE: ${{ steps.select.outputs.suite }}
        run: uv run --locked pt-bench plan --suite "$SUITE" --output build/plan.json

      - name: Summarise the gate
        if: always()
        env:
          SUITE: ${{ steps.select.outputs.suite }}
        run: |
          {
            echo "## Chat benchmark plan"
            echo
            echo "- Suite: \`$SUITE\`"
            echo "- Run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f build/plan.json ]; then
            echo "- Plan: created" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Plan: **refused** (see the job log for the outstanding obligations)" \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the run plan
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chat-benchmark-plan
          path: build/plan.json
          if-no-files-found: warn
          retention-days: 90

  subject:
    name: Measure ${{ matrix.subject }} repetition ${{ matrix.repetition }}
    needs: plan
    # Physical Android device bank. Unreachable while the plan gate refuses, because
    # `needs` short-circuits; when provisioned this is the only job that touches a real
    # account or device.
    runs-on: [self-hosted, Linux, android-device-bank]
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        subject: [signal-android-default, whatsapp-android-default, telegram-android-default]
        repetition: [1]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.18"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --locked --all-extras --all-groups

      - name: Download the run plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: chat-benchmark-plan
          path: build

      - name: Observe the measurement device
        # The architecture lists device-preflight as its own job. It runs here instead,
        # in the same job as the measurement, so the observation necessarily describes
        # the exact device that produced the result. A separate job could be scheduled
        # onto a different device from the same bank, and a row whose device model did
        # not match its measurement is worse than no observation at all.
        #
        # Records the installed app version, build, package hash, device model, and OS
        # build that the subject intentionally left unset at declaration time.
        env:
          SUBJECT: ${{ matrix.subject }}
        run: |
          serial="$(adb devices | awk 'NR>1 && $2=="device" {print $1; exit}')"
          if [ -z "$serial" ]; then
            echo "no adb device is attached to this runner" >&2
            exit 1
          fi
          uv run --locked pt-bench preflight \
            --subject "$SUBJECT@1.0.0" \
            --adb-serial "$serial" \
            --output build/observation.json

      - name: Measure one repetition
        # No --adapter: each check is answered by the adapter its own definition names.
        # The chat suite deliberately mixes chat-appium and chat-notification, which a
        # single global adapter could not serve.
        env:
          SUBJECT: ${{ matrix.subject }}
          REPETITION: ${{ matrix.repetition }}
        run: |
          uv run --locked pt-bench execute \
            --plan build/plan.json \
            --subject "$SUBJECT" \
            --repetition "$REPETITION" \
            --output-dir build/executions

      - name: Finalize the execution
        env:
          SUBJECT: ${{ matrix.subject }}
          REPETITION: ${{ matrix.repetition }}
        run: |
          uv run --locked pt-bench finalize \
            --plan build/plan.json \
            --execution-dir "build/executions/$SUBJECT/$(printf '%04d' "$REPETITION")"

      - name: Upload the execution
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chat-execution-${{ matrix.subject }}-${{ matrix.repetition }}
          path: build/executions
          if-no-files-found: warn
          retention-days: 30

  aggregate:
    name: Aggregate the run
    needs: [plan, subject]
    # Runs even when a subject failed or was cancelled, so an incomplete run is visible
    # as an incomplete bundle rather than silently absent. Missing subjects become
    # `error`/`not_tested`, never a product `fail`.
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.18"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --locked --all-extras --all-groups

      - name: Download the run plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: chat-benchmark-plan
          path: build

      - name: Stop when the plan gate refused
        # The plan gate refuses there is no plan and nothing to aggregate. This job still
        # runs so an incomplete run is visible, but it must not report a misleading
        # missing-artifact failure. `final-health-check` is the authoritative verdict.
        if: hashFiles('build/plan.json') == ''
        run: |
          echo "The plan gate refused this run, so there is nothing to aggregate." \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Download every available execution
        if: hashFiles('build/plan.json') != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          pattern: chat-execution-*
          path: build/executions
          merge-multiple: true

      - name: Aggregate
        # Exit 2 means the bundle is valid but incomplete, which is reported rather than
        # hidden. Only a genuine aggregation failure is fatal here.
        if: hashFiles('build/plan.json') != ''
        run: |
          status=0
          uv run --locked pt-bench aggregate \
            --plan build/plan.json \
            --executions build/executions \
            --output build/bundle || status=$?
          if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then
            echo "aggregation failed" >&2
            exit "$status"
          fi

      - name: Validate the bundle contract
        if: hashFiles('build/bundle/manifest.json') != ''
        run: uv run --locked pt-bench schemas validate --kind run-bundle build/bundle/manifest.json

      - name: Upload the run bundle
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chat-benchmark-bundle
          path: build/bundle
          if-no-files-found: warn
          retention-days: 90

  publish:
    name: Publish the run
    needs: [plan, aggregate]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.18"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --locked --all-extras --all-groups

      - name: Download the run bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: chat-benchmark-bundle
          path: build

      - name: Offer the bundle for publication
        # Fail-closed. Every unmet requirement is reported at once.
        run: |
          if [ ! -f build/bundle/manifest.json ]; then
            echo '{"published": false, "reasons": ["no run bundle was produced"]}' \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 2
          fi
          uv run --locked pt-bench publish \
            --bundle build/bundle \
            --staging build/publication | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the publication receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chat-benchmark-receipt
          path: build/publication
          if-no-files-found: warn
          retention-days: 90

  transport:
    name: Publish the bundle
    needs: [plan, aggregate, publish]
    # Reached only when the harness produced a publication receipt, which it does only
    # for a bundle that cleared every operational requirement.
    if: needs.publish.result == 'success'
    uses: ./.github/workflows/_publish-benchmark.yml
    # Granted only to the reusable transport, which re-checks the receipt before moving
    # any bytes. Unreachable unless the harness already cleared the publication gate.
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      lane: chat
      bundle-artifact: chat-benchmark-bundle
      receipt-artifact: chat-benchmark-receipt
      release-tag: benchmark-data

  final-health-check:
    name: Final health check
    needs: [plan, subject, aggregate, publish, transport]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # The single authoritative verdict. A product `fail` is a successful measurement
      # and does not fail this job; an incomplete or unpublished run does.
      - name: Report the run outcome
        env:
          PLAN: ${{ needs.plan.result }}
          AGGREGATE: ${{ needs.aggregate.result }}
          PUBLISH: ${{ needs.publish.result }}
          TRANSPORT: ${{ needs.transport.result }}
        run: |
          {
            echo "## Final health check"
            echo
            echo "- plan: \`$PLAN\`"
            echo "- aggregate: \`$AGGREGATE\`"
            echo "- publish: \`$PUBLISH\`"
            echo "- transport: \`$TRANSPORT\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$PLAN" != "success" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The canonical lane was refused at the plan gate. See the plan job for" \
              "the outstanding provider-terms reviews, vantage, and runner lanes." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "$AGGREGATE" != "success" ] || [ "$PUBLISH" != "success" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The run did not aggregate and publish cleanly." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "$TRANSPORT" != "success" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The bundle cleared the gate but was not transported to the release." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
