name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    name: Build attested release assets
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.18"

      - name: Install locked build dependencies
        run: uv sync --locked --all-extras --all-groups

      - name: Run quality gate
        run: |
          uv run --locked ruff format --check .
          uv run --locked ruff check .
          uv run --locked ty check src tests
          uv run --locked pytest
          uv run --locked pt-bench registry validate
          uv run --locked pt-bench schemas export --output-dir schemas/v1alpha1 --check

      - name: Build distributions
        run: uv build

      - name: Generate software bill of materials
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/sbom.cdx.json

      - name: Attest wheel
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*.whl"

      - name: Attest source distribution
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*.tar.gz"

      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --generate-notes

      - name: Upload release assets as workflow artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
